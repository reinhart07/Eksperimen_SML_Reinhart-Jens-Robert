name: Automated Preprocessing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn

      - name: Run Preprocessing
        run: |
          cd preprocessing
          python automate_Reinhart-Jens-Robert.py

      - name: Upload Preprocessed Dataset
        uses: actions/upload-artifact@v3
        with:
          name: iris_preprocessing
          path: preprocessing/iris_preprocessing/

      - name: Commit Preprocessed Data to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add preprocessing/iris_preprocessing/
          git diff --cached --quiet || git commit -m "Auto: update preprocessed dataset [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
